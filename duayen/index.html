<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>کتاب وسنت کی دعائیں</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <button id="backBtn" class="icon-btn hidden" onclick="goBack()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
        <h1 id="pageTitle">کتاب وسنت کی دعائیں</h1>
        <div class="header-actions">
            <button id="bookmarkBtn" class="icon-btn" onclick="showBookmarks()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            </button>
        </div>
    </header>

    <div id="searchContainer" class="search-section">
        <div class="search-box">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" placeholder="تلاش کریں..." onkeyup="searchDua()">
        </div>
    </div>

    <main id="content">
        <!-- Content will load here via JS -->
    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
